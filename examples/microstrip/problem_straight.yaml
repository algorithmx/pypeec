        dielectric: {rho_re: 0.0, rho_im: -528.6795168335764}
      source_val:
        src: {V_re: 1.0, V_im: 0.0, Z_re: 50.0, Z_im: 0.0}
        sink: {V_re: 0.0, V_im: 0.0, Z_re: 50.0, Z_im: 0.0}
        ground_src: {V_re: 0.0, V_im: 0.0, Z_re: 1.0e-06, Z_im: 0.0}
