material_def:
  conductor:
    domain_list: [trace, ground, src, sink]
    material_type: electric
    orientation_type: isotropic
    var_type: lumped
  dielectric:
    domain_list: [substrate]
    material_type: electric
    orientation_type: isotropic
    var_type: lumped
source_def:
  src:
    domain_list: [src]
    source_type: voltage
    var_type: lumped
  sink:
    domain_list: [sink]
    source_type: voltage
    var_type: lumped
  ground_src:
    domain_list: [ground]
    source_type: voltage
    var_type: lumped
