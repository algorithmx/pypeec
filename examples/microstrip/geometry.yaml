mesh_type: shape
data_voxelize:
  param: {dx: 1.0e-06, dy: 1.0e-06, dz: 1.0e-06, cz: 0.0, simplify: 1.0e-08, construct: null,
    xy_min: null, xy_max: null}
  layer_stack:
  - {n_layer: 1, tag_layer: layer_gnd}
  - {n_layer: 4, tag_layer: layer_sub}
  - {n_layer: 2, tag_layer: layer_top}
  geometry_shape:
    ground:
    - shape_layer: [layer_gnd]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell: &id001
        - [-8.5e-06, -1.5e-05]
        - [8.950000000000001e-05, -1.5e-05]
        - [8.950000000000001e-05, 3.6e-05]
        - [-8.5e-06, 3.6e-05]
        coord_holes: []
    substrate:
    - shape_layer: [layer_sub]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell: *id001
        coord_holes: []
    trace:
    - shape_layer: [layer_top]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell:
        - [0.0, -2.0e-06]
        - [8.1e-05, -2.0e-06]
        - [8.1e-05, 2.0e-06]
        - [0.0, 2.0e-06]
        coord_holes: []
    - shape_layer: [layer_top]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell:
        - [4.1e-05, 0.0]
        - [4.5e-05, 0.0]
        - [4.5e-05, 2.8e-05]
        - [4.1e-05, 2.8e-05]
        coord_holes: []
    src:
    - shape_layer: [layer_top]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell:
        - [-5.0e-07, -2.0e-06]
        - [5.0e-07, -2.0e-06]
        - [5.0e-07, 2.0e-06]
        - [-5.0e-07, 2.0e-06]
        coord_holes: []
    sink:
    - shape_layer: [layer_top]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell:
        - [8.05e-05, -2.0e-06]
        - [8.15e-05, -2.0e-06]
        - [8.15e-05, 2.0e-06]
        - [8.05e-05, 2.0e-06]
        coord_holes: []
    trace_bottom:
    - shape_layer: [layer_top]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell:
        - [0.0, -7.000000000000001e-06]
        - [4.5e-05, -7.000000000000001e-06]
        - [4.5e-05, -3.0000000000000005e-06]
        - [0.0, -3.0000000000000005e-06]
        coord_holes: []
    src_bottom:
    - shape_layer: [layer_top]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell:
        - [-5.0e-07, -7.000000000000001e-06]
        - [5.0e-07, -7.000000000000001e-06]
        - [5.0e-07, -3.0000000000000005e-06]
        - [-5.0e-07, -3.0000000000000005e-06]
        coord_holes: []
    sink_bottom:
    - shape_layer: [layer_top]
      shape_operation: add
      shape_type: polygon
      shape_data:
        buffer: 0.0
        coord_shell:
        - [4.4500000000000004e-05, -7.000000000000001e-06]
        - [4.55e-05, -7.000000000000001e-06]
        - [4.55e-05, -3.0000000000000005e-06]
        - [4.4500000000000004e-05, -3.0000000000000005e-06]
        coord_holes: []
data_point:
  check_cloud: false
  filter_cloud: false
  pts_cloud: []
data_resampling:
  use_reduce: false
  use_resample: false
  resampling_factor: [1, 1, 1]
data_conflict:
  resolve_rules: true
  resolve_random: false
  conflict_rules:
  - domain_resolve: [trace]
    domain_keep: [src, sink]
  - domain_resolve: [trace_bottom]
    domain_keep: [src_bottom, sink_bottom]
  - domain_resolve: [ground]
    domain_keep: [substrate]
  - domain_resolve: [substrate]
    domain_keep: [trace, trace_bottom, src, sink, src_bottom, sink_bottom]
data_integrity:
  check_integrity: true
  domain_connected:
    signal_top:
      domain_group:
      - [trace]
      - [src, sink]
      connected: true
    signal_bottom:
      domain_group:
      - [trace_bottom]
      - [src_bottom, sink_bottom]
      connected: true
    ground:
      domain_group:
      - [ground]
      connected: true
  domain_adjacent: {}
