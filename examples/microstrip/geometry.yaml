# Definition of the microstrip geometry
"mesh_type": "shape"

"data_voxelize":
    "param":
        "dx": 0.1e-3
        "dy": 0.1e-3
        "dz": 0.1e-3
        "cz": 0.0
        "simplify": 1.0e-6
        "construct": null
        "xy_min": null
        "xy_max": null

    "layer_stack":
        - {"n_layer": 1, "tag_layer": "layer_gnd"}
        - {"n_layer": 10, "tag_layer": "layer_sub"}
        - {"n_layer": 1, "tag_layer": "layer_top"}

    "geometry_shape":
        "ground":
            -
                "shape_layer": ["layer_gnd"]
                "shape_operation": "add"
                "shape_type": "trace"
                "shape_data":
                    "width": 5.0e-3
                    "coord": [[0.0e-3, 0.0e-3], [10.0e-3, 0.0e-3]]
        "substrate":
             -
                "shape_layer": ["layer_sub"]
                "shape_operation": "add"
                "shape_type": "trace"
                "shape_data":
                    "width": 5.0e-3
                    "coord": [[0.0e-3, 0.0e-3], [10.0e-3, 0.0e-3]]
        "trace":
            -
                "shape_layer": ["layer_top"]
                "shape_operation": "add"
                "shape_type": "trace"
                "shape_data":
                    "width": 0.5e-3
                    "coord": [[0.0e-3, 0.0e-3], [10.0e-3, 0.0e-3]]
        "src":
            -
                "shape_layer": ["layer_top"]
                "shape_operation": "add"
                "shape_type": "pad"
                "shape_data":
                    "diameter": 0.5e-3
                    "coord": [[0.0e-3, 0.0e-3]]
        "sink":
             -
                "shape_layer": ["layer_top"]
                "shape_operation": "add"
                "shape_type": "pad"
                "shape_data":
                    "diameter": 0.5e-3
                    "coord": [[10.0e-3, 0.0e-3]]

"data_point":
    "check_cloud": false
    "filter_cloud": false
    "pts_cloud": []

"data_resampling":
    "use_reduce": false
    "use_resample": false
    "resampling_factor": [1, 1, 1]

"data_conflict":
    "resolve_rules": true
    "resolve_random": false
    "conflict_rules":
        - {"domain_resolve": ["trace"], "domain_keep": ["src", "sink"]}
        - {"domain_resolve": ["ground"], "domain_keep": ["substrate"]}
        - {"domain_resolve": ["substrate"], "domain_keep": ["trace", "src", "sink"]}
        # Ensure trace/src/sink carve out of substrate if they overlap?
        # No, they are on different layers.
        # Ground is layer_gnd. Substrate is layer_sub. Trace is layer_top.
        # No Z overlap.
        # But wait, conflict rules only matter if they overlap in voxels.
        # Since I used distinct layers, there should be no conflict.
        # But if I made substrate cover everything (all layers), I would need rules.
        # Here it is fine. I'll keep them minimal.

"data_integrity":
    "check_integrity": true
    "domain_connected":
        "signal": {"domain_group": [["trace"], ["src", "sink"]], "connected": true}
    "domain_adjacent": {}
