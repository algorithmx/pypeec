# Definition of the Conda Development Environment for macOS.
#
# This is a macOS-compatible version of conda.yaml with GPU packages removed.
#
# Thomas Guillod - Dartmouth College
# Mozilla Public License Version 2.0

name: pypeec
channels: [conda-forge]
dependencies:
  # base installation
  - python=3.13
  # dev tools
  - pip
  - ruff
  - twine
  - coverage
  - setuptools_scm
  - sphinx_rtd_theme
  - sphinx
  - pkg-config
  - python-build
  # logging and serialization
  - scilogger>=1.2.5
  - scisave>=1.6.0
  # numerical libraries
  - numpy>=1.24.0
  - scipy>=1.12.0
  - joblib>=1.3.0
  # geometry libraries
  - vtk>=9.2.0
  - pyvista>=0.45.0
  - shapely>=2.0.0
  - rasterio>=1.3.0
  - pillow>=10.0.0
  - matplotlib-base>=3.7.0
  # interface libraries
  - qtpy>=2.4.0
  - pyside6>=6.7.0
  - pyvistaqt>=0.11.0
  # optional packages for Jupyter
  - jupyterlab
  - ipython
  # optional optimized numerical libraries (excluding GPU-only packages)
  - pyamg
  - pyfftw
